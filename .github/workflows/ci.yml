name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar (versiones fijadas)
        run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Formato
        run: python -m ruff format --check .
      - name: Tipos (mypy --strict)
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q --cov=tradebot --cov-fail-under=90

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditar dependencias conocidas como vulnerables
        run: |
          python -m pip install -c constraints.txt -e ".[dev]"
          python -m pip_audit
