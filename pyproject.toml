[project]
name = "tradebot"
version = "0.1.0"
description = "Bot de trading con directrices en lenguaje natural, reglas versionadas y motor de riesgo independiente"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "ccxt>=4.3",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7", "pre-commit>=3.8"]

[project.scripts]
tradebot = "tradebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "N", "C4", "RET", "ARG", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG", "N817"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ccxt", "ccxt.*", "anthropic", "anthropic.*"]
ignore_missing_imports = true

[tool.coverage.report]
fail_under = 90
