# Instalar una vez:  pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push
# Hooks "locales": usan las versiones fijadas de tu propio entorno, sin descargar nada extra.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint)
        entry: python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff (formato)
        entry: python -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: python -m mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: guard-secrets
        name: guardia anti-secretos
        entry: python -m tradebot.guard_secrets
        language: system
        # los tests de la propia guardia contienen secretos FALSOS a propósito
        exclude: ^tests/test_guard_secrets\.py$
      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
